# Netlify 配置：仓库里已经带着导出好的静态文件，不需要构建命令。
#
# 关键点：publish 指向已提交到仓库的 build/web。
# 之前部署失败就是因为 .gitignore 排除了 build/ 和 *.pck，这个目录根本不在仓库里。

[build]
  publish = "build/web"

# 大文件缓存（首次下载后浏览器复用）
[[headers]]
  for = "/index.wasm"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.pck"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
