# Netlify 配置
#
# 这个仓库里已经带着导出好的 Godot Web 构建（build/web），
# 所以"构建"只是占位，真正的产物在 publish 目录里。

[build]
  command = "echo 'static Godot export, nothing to build'"
  publish = "build/web"

# 大文件缓存（首次下载后浏览器复用）
[[headers]]
  for = "/index.wasm"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.pck"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"