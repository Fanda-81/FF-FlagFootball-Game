# Netlify 閰嶇疆
#
# 杩欎釜浠撳簱閲屽凡缁忓甫鐫€瀵煎嚭濂界殑 Godot Web 鏋勫缓锛坆uild/web锛夛紝
# 鎵€浠?鏋勫缓"鍙槸鍗犱綅锛岀湡姝ｇ殑浜х墿鍦?publish 鐩綍閲屻€?
[build]
  # 显式声明仓库根目录，避免 Netlify 站点设置里的 Base directory 影响路径解析
  base = ""
  command = "echo 'static Godot export, nothing to build'"
  publish = "build/web"

# 澶ф枃浠剁紦瀛橈紙棣栨涓嬭浇鍚庢祻瑙堝櫒澶嶇敤锛?[[headers]]
  for = "/index.wasm"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.pck"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"